<title>REA iPhone</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one column; a sticky chrome (brand, file, section rail) over flat
   sections. Cards only for the app identity and code. Content max 1040px. */
:root {
  --bg: #f4f6f9; --surface: #ffffff; --sunk: #eaeef4; --ink: #101826; --muted: #566174; --line: #d8dee7;
  --accent: #2448c9; --accent-ink: #ffffff; --accent-soft: #e4eafc;
  --addr: #0b6b62; --kw: #8326b0; --comment: #687386;
  --ok: #17703f; --ok-soft: #e1f3e8; --warn: #8f5300; --warn-soft: #fbedd5; --crit: #b42318; --crit-soft: #fde6e3;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: light;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1017; --surface: #121a25; --sunk: #0f161f; --ink: #e5eaf2; --muted: #93a0b3; --line: #243143;
    --accent: #7d9bff; --accent-ink: #0b1017; --accent-soft: #1b2850;
    --addr: #5fd6c6; --kw: #d49bff; --comment: #7f8ba0;
    --ok: #5bd48c; --ok-soft: #12301f; --warn: #f2b84b; --warn-soft: #33260c; --crit: #ff8a7f; --crit-soft: #3a1714;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1017; --surface: #121a25; --sunk: #0f161f; --ink: #e5eaf2; --muted: #93a0b3; --line: #243143;
  --accent: #7d9bff; --accent-ink: #0b1017; --accent-soft: #1b2850;
  --addr: #5fd6c6; --kw: #d49bff; --comment: #7f8ba0;
  --ok: #5bd48c; --ok-soft: #12301f; --warn: #f2b84b; --warn-soft: #33260c; --crit: #ff8a7f; --crit-soft: #3a1714;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 var(--sans);
  padding-left: var(--gutter-l); padding-right: var(--gutter-r); padding-block: 0 48px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1040px; margin-inline: auto; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.mono { font-family: var(--mono); font-size: 0.9em; }
.muted { color: var(--muted); }
.wrapall { overflow-wrap: anywhere; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.2; }
h2 { font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 650; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Chrome */
.chrome {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  margin-inline: calc(-1 * var(--gutter-l)) calc(-1 * var(--gutter-r));
  padding-inline: var(--gutter-l) var(--gutter-r); border-bottom: 1px solid var(--line);
}
.bar { display: flex; align-items: center; gap: 12px; padding-block: 10px 8px; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 17px; letter-spacing: -0.01em; margin-right: auto; }
.brand svg { width: 28px; height: 28px; border-radius: 7px; flex: none; }
.filebar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding-bottom: 8px; min-width: 0; }
.filebar .name { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.filebar select { max-width: 100%; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; padding-bottom: 8px; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: none; appearance: none; border: 0; background: none; color: var(--muted); cursor: pointer;
  font: 600 14px var(--sans); padding: 7px 12px; border-radius: 999px; display: inline-flex; gap: 6px; align-items: center;
}
.tab .n { font: 600 11px var(--mono); color: inherit; opacity: 0.75; font-variant-numeric: tabular-nums; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); }

/* Controls */
.btn {
  appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer;
  border-radius: 9px; padding: 8px 13px; min-height: 40px; font: 600 14px var(--sans);
  display: inline-flex; align-items: center; gap: 6px; text-decoration: none; white-space: nowrap;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.small { min-height: 32px; padding: 4px 10px; font-size: 13px; }
.field, select.field, textarea.field {
  width: 100%; font: 16px/1.4 var(--sans); color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px;
}
textarea.field { font-family: var(--mono); font-size: 14px; min-height: 110px; resize: vertical; }
select.field { width: auto; }
label.check { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toolbar .grow { flex: 1 1 220px; min-width: 0; }

/* Status and toast */
.status { display: flex; gap: 10px; align-items: center; padding: 12px 0; color: var(--muted); }
.spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin 0.8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
.error { background: var(--crit-soft); color: var(--crit); border-radius: 10px; padding: 12px 14px; margin-top: 14px; }
.notice { background: var(--accent-soft); border-radius: 10px; padding: 10px 14px; margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 20;
  background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 10px; font-weight: 600; font-size: 14px; max-width: calc(100% - 32px);
}

/* Panels */
.panel { display: grid; gap: 22px; padding-top: 18px; }
.section { display: grid; gap: 10px; min-width: 0; }
.ident { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.ident h1 { font-size: 26px; letter-spacing: -0.02em; }
.ident .bid { font-family: var(--mono); font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.spec { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; margin: 0; }
@media (min-width: 640px) { .spec { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.spec div { min-width: 0; }
.spec dt { font-size: 12px; color: var(--muted); }
.spec dd { margin: 0; font: 600 14px var(--mono); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 720px) { .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.stat { appearance: none; text-align: left; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; color: var(--ink); font: inherit; }
.stat:hover { border-color: var(--accent); }
.stat b { display: block; font: 700 24px var(--sans); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.stat span { font-size: 13px; color: var(--muted); }
.attn { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.attn li { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; padding: 10px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); min-width: 0; }
.attn li > div { min-width: 0; }
.sev { font: 700 11px var(--sans); letter-spacing: 0.05em; text-transform: uppercase; padding: 2px 7px; border-radius: 6px; margin-top: 2px; }
.sev.crit { background: var(--crit-soft); color: var(--crit); }
.sev.warn { background: var(--warn-soft); color: var(--warn); }
.sev.ok { background: var(--ok-soft); color: var(--ok); }
.sev.info { background: var(--accent-soft); color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 6px; background: var(--sunk); font: 600 12.5px var(--mono); overflow-wrap: anywhere; max-width: 100%; }
.kv { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; margin: 0; border-top: 1px solid var(--line); }
.kv > div { display: grid; grid-template-columns: minmax(0, 11rem) minmax(0, 1fr); gap: 4px 14px; padding: 9px 0; border-bottom: 1px solid var(--line); }
@media (max-width: 560px) { .kv > div { grid-template-columns: minmax(0, 1fr); } }
.kv dt { color: var(--muted); font-size: 14px; }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-weight: 600; color: var(--muted); background: var(--sunk); }
td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }

/* Lists of classes, types, strings, symbols */
.list { display: grid; border-top: 1px solid var(--line); }
.item { border-bottom: 1px solid var(--line); min-width: 0; }
.item > summary { list-style: none; cursor: pointer; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 10px 2px; }
.item > summary::-webkit-details-marker { display: none; }
.item > summary::before { content: "›"; color: var(--muted); font-weight: 700; width: 0.7em; transition: transform 0.15s; }
.item[open] > summary::before { transform: rotate(90deg); }
.item .title { font: 600 14.5px var(--mono); overflow-wrap: anywhere; min-width: 0; }
.item .meta { font-size: 13px; color: var(--muted); }
.item .body { padding: 0 0 12px; display: grid; gap: 8px; min-width: 0; }
.tag { font: 700 10.5px var(--sans); letter-spacing: 0.05em; text-transform: uppercase; padding: 1px 6px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: start; padding: 8px 2px; border-bottom: 1px solid var(--line); }
.row .v { font-family: var(--mono); font-size: 13.5px; overflow-wrap: anywhere; min-width: 0; }
.row .d { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.row .addr { color: var(--addr); font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; }
.more { justify-self: start; margin-top: 10px; }

/* Code */
pre.code {
  margin: 0; background: var(--sunk); border-radius: 10px; padding: 12px 14px; overflow-x: auto;
  font: 12.5px/1.6 var(--mono); tab-size: 4; color: var(--ink); max-height: 70vh;
}
pre.code.tall { max-height: none; }
pre.code.wrap { white-space: pre-wrap; overflow-wrap: anywhere; }
.code .k { color: var(--kw); font-weight: 600; }
.code .c { color: var(--comment); }
.code .a { color: var(--addr); }
.prose { max-width: 65ch; margin: 0; color: var(--ink); }
.prose code, .cmd { font-family: var(--mono); font-size: 0.92em; background: var(--sunk); padding: 1px 5px; border-radius: 5px; overflow-wrap: anywhere; }
.drop { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: color-mix(in srgb, var(--bg) 85%, transparent); border: 3px dashed var(--accent); font-size: 20px; font-weight: 700; color: var(--accent); }
footer { margin-top: 36px; font-size: 13px; color: var(--muted); display: grid; gap: 4px; }
</style>
<!-- end-head -->
<div class="wrap">
  <div class="chrome">
    <div class="bar">
      <div class="brand">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f5be0"/><stop offset="1" stop-color="#1b37a6"/></linearGradient></defs>
          <rect width="64" height="64" fill="url(#g)"/>
          <circle cx="28" cy="27" r="15" fill="none" stroke="#fff" stroke-width="4"/>
          <path d="M39 38 L51 50" stroke="#fff" stroke-width="6.5" stroke-linecap="round"/>
          <rect x="21.5" y="22.5" width="8.5" height="2" fill="#b9cbff"/><rect x="21.5" y="26" width="13" height="2" fill="#b9cbff"/><rect x="21.5" y="29.5" width="6.5" height="2" fill="#b9cbff"/>
        </svg>
        <span>REA iPhone</span>
      </div>
      <label class="btn primary" for="file">Open app</label>
      <input id="file" class="vh" type="file">
    </div>
    <div class="filebar" id="filebar" hidden></div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Sections" hidden></nav>
  </div>

  <div class="status" id="status" role="status" aria-live="polite" hidden><span class="spin"></span><span id="status-text">Starting</span></div>
  <div id="error" class="error" role="alert" hidden></div>
  <div id="notice" class="notice" hidden></div>

  <main id="panels"></main>

  <footer>
    <span>Runs entirely on this device. Files you open are never uploaded.</span>
    <span>For apps you own or are authorized to examine.</span>
  </footer>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<div id="drop" class="drop" hidden>Drop an .ipa or binary to analyze</div>
<script type="module" src="app.js"></script>
